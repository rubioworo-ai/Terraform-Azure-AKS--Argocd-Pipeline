
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blue-green-pipeline
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/rubioworo/Terraform-Azure-AKS--Argocd-Pipeline.git'
    targetRevision: HEAD
    path: 'k8s/blue-green-app'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: blue-green-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
