name: DevSecOps Pipeline

on:
  push:
    branches:
      - qa-engineer
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'server.ts'
  pull_request:
    branches:
      - qa-engineer
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'server.ts'

jobs:
  security-scan-secrets:
    name: GitLeaks Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks (Docker)
        run: |
          docker run --rm -v ${{ github.workspace }}:/path zricethezav/gitleaks:latest detect --source=/path --verbose
