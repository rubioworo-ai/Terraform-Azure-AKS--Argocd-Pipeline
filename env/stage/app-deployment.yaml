apiVersion: apps/v1
kind: Deployment
metadata:
  name: quickbite-app-stage
  namespace: stage
  labels:
    app: quickbite-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quickbite-app-stage
  template:
    metadata:
      labels:
        app: quickbite-app-stage
    spec:
      containers:
      - name: app
        image: rukevweubio/quickbite:latest
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: database-url
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false 
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
